<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" href="../static/img/icon.avif">
        <title>Talos</title>
        <link rel="stylesheet" href="../static/css/cadastro.css">
    </head>
    <body>
        <h3>Cadastro</h3>
        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <p> Informe seu e-mail e senha para acesso </p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('cadastro') }}" method="POST">
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Informe seu E-mail"
                required>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                minlength="8"
                required>


            <button class="enviarcadastro" type="submit"></button>
            Cadastro
        </form>
        <a href="/">
            <button class="voltar" type="button">
                ← Voltar
            </button>
        </a>
        <a href="login">
            <button class="jateracc" type="button">Ja tenho conta</button>
        </a>
    </body>
</html>
