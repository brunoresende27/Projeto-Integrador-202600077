<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>ChatBot</title>
        <link rel="stylesheet" href="../static/css/style.css">
    </head>
    <body>
        <h2>login</h2>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <p class="{{ categoria }}">{{ mensagem }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="quadradologin"></div>
            <input
                type="email"
                id="loginemail"
                name="loginemail"
                placeholder="Digite seu E-mail"
                required>

            <input
                type="password"
                id="loginsenha"
                name="loginsenha"
                placeholder="Digite sua senha"
                minlength="8"
                required>

            <button class="logar" type="submit"> 
                Logar na conta
            </button>>
        </form>
        <a href="/">
            <button class="voltar" type="button">
                ← Voltar
            </button>
        </a>
    </body>
</html>
