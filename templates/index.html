<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>ChatBot</title>
        <link rel="stylesheet" href="../static/css/style.css">
    </head>
    <body>
        <main>
        <form action="http://127.0.0.1:5000" method="GET">
            <div class="chatcontainer">
                <div class="message-row-apresentar">
                    <div class="message-bubble">
                        {% if msg_inicial %}
                            <h2>Talos:</h2>
                            {{ msg_inicial|safe }}
                        {% endif %}
                    </div>
                </div>

                <div class="message-row user">
                    <div class="message-bubble">
                        {% if resultado_u %}
                            <h2>Usuario:</h2>
                            {{ resultado_u|safe }}
                        {% endif %}
                    </div>
                </div>

                <div class="message-row-system">
                    <div class="message-bubble">
                        {% if resultado_s %}
                            <h2>Talos:</h2>
                            {{ resultado_s|safe }}
                        {% endif %}
                    </div>
                </div>

            </div>
        </form>
        <form method="POST">
            <div class="chat">
                <input
                type="text"
                name="chat"
                placeholder="Escreva sua mensagem aqui."
                />
                <button class="botaoenviar" type="submit">
                    <img src="../static/img/enviar.png" alt="enviar mensagem">
                </button>
            </div>
        </form>
        </main>
    </body>
</html>
