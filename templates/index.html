<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>ChatBot</title>
        <link rel="stylesheet" href="../static/css/style.css">
    </head>
    <body>
        <main>
        <form action="http://127.0.0.1:5000" method="GET">
            <div class="chatcontainer">
                <div class="message-row-apresentar">
                    <div class="message-bubble">
                        {% if apresentar %}
                            <h2>Talos:</h2>
                            {{ apresentar|safe }}
                        {% endif %}
                    </div>
                </div>

                <div class="message-row user">
                    <div class="message-bubble">
                        {% if usuario %}
                            <h2>Usuario:</h2>
                            {{ usuario|safe }}
                        {% endif %}
                    </div>
                </div>

                <div class="message-row-system">
                    <div class="message-bubble">
                        {% if sistema %}
                            <h2>Talos:</h2>
                            {{ sistema|safe }}
                        {% endif %}
                    </div>
                </div>

            </div>
        </form>
        <form method="POST">
            <div class="chat">
                <input
                type="text"
                name="chat"
                placeholder="Escreva sua mensagem aqui."
                />
                <button class="botaoenviar" type="submit">
                    <img src="../static/img/enviar.png" alt="enviar mensagem">
                </button>
            </div>
        </form>
        <div>
            <a href="cadastro">
                <button class="cadastro" type="button">
                    Ainda não tenho uma conta
                </button>
            </a>
            <a href="login">
                <button class="login" type="button">
                    Entrar na conta
                </button>
            </a>
        </div>
        </main>
    </body>
</html>
